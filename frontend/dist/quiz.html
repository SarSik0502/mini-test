<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Тест по сетевой безопасности · Мини-тест</title>
    <link rel="stylesheet" href="/styles.css?v=3">
    <script src="/quiz.js" defer></script>
  </head>
  <body>
    <main class="page quiz-page">
      <header class="page-header">
        <p class="subject">Мини-тест</p>
        <h1>Тест по сетевой безопасности</h1>
        <p class="page-link"><a href="/">Редактор вопросов</a></p>
      </header>

      <section class="panel">
        <p id="quiz-message" class="feedback" role="status">Загружаем вопросы…</p>
        <button type="button" id="reload-quiz" class="secondary" hidden>Загрузить заново</button>
        <form id="quiz-form" hidden>
          <fieldset id="answer-fields">
            <div id="quiz-questions" class="quiz-questions"></div>
          </fieldset>
          <button type="submit" id="submit-answers">Отправить ответы</button>
        </form>
        <div id="result-panel" hidden>
          <h2 id="result-title" tabindex="-1">Результат попытки</h2>
          <output id="score" class="quiz-score" aria-live="polite" hidden></output>
          <button type="button" id="check-result" class="secondary" hidden>Проверить снова</button>
          <a href="/quiz.html">Новая попытка</a>
        </div>
      </section>
    </main>
  </body>
</html>
